<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="acct_page_title">Account — Ghal Bol</title>
  <meta name="description" content="Create a Ghal Bol account or sign in." />
  <link rel="canonical" href="https://ghalbol.com/account" />
  <meta name="theme-color" content="#0d0b3a" />
  <link rel="icon" href="/favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/legal.css" />
  <link rel="stylesheet" href="/css/account.css" />
  <link rel="stylesheet" href="/css/site-fonts.css" />
  <link rel="stylesheet" href="/css/auth-nav.css" />
  <script src="/js/firebase-init.js" defer></script>
  <script src="/js/auth-nav.js" defer></script>
  <script src="/js/lang-nav.js" defer></script>
  <script src="/js/site-i18n.js" defer></script>
  <script src="/js/account.js" defer></script>
</head>
<body>
  <header class="topbar" id="topbar">
    <a class="brand" href="/" aria-label="Ghal Bol home" data-i18n-aria-label="acct_home_aria">
      <img src="/media/icon.webp" width="40" height="40" alt="" />
      <span class="brand-lockup">
        <span class="brand-text">Ghal Bol</span>
      </span>
    </a>
    <nav class="topnav" id="topnav" aria-label="Primary" data-i18n-aria-label="acct_nav_aria">
<a href="/" data-i18n="home">Home</a>
      <a href="/privacy" data-i18n="privacy">Privacy</a>
      <a href="/account" data-i18n="account">Account</a>
      <a class="site-github" href="https://github.com/gotigin/ghalbol" target="_blank" rel="noopener noreferrer" aria-label="GitHub" title="GitHub">
        <svg viewBox="0 0 98 96" aria-hidden="true" focusable="false"><path fill="currentColor" fill-rule="evenodd" d="M48.854 0C21.839 0 0 22 0 49.217c0 21.756 13.993 40.172 33.405 46.69 2.427.49 3.316-1.059 3.316-2.362 0-1.141-.08-5.052-.08-9.127-13.59 2.934-16.42-5.867-16.42-5.867-2.184-5.704-5.42-7.17-5.42-7.17-4.448-3.015.324-3.015.324-3.015 4.934.326 7.523 5.052 7.523 5.052 4.367 7.496 11.404 5.378 14.235 4.074.404-3.178 1.699-5.378 3.074-6.6-10.839-1.141-22.243-5.378-22.243-24.283 0-5.378 1.94-9.778 5.014-13.2-.485-1.222-2.184-6.275.486-13.038 0 0 4.125-1.304 13.426 5.052a46.97 46.97 0 0 1 12.214-1.63c4.125 0 8.33.571 12.213 1.63 9.302-6.356 13.427-5.052 13.427-5.052 2.67 6.763.97 11.816.485 13.038 3.155 3.422 5.015 7.822 5.015 13.2 0 18.905-11.404 23.06-22.324 24.283 1.78 1.548 3.316 4.481 3.316 9.126 0 6.6-.08 11.897-.08 13.526 0 1.304.89 2.853 3.316 2.364 19.412-6.52 33.405-24.935 33.405-46.691C97.707 22 75.788 0 48.854 0z"/></svg>
      </a>
      <span id="site-lang-chrome" class="site-lang-chrome"></span>
    </nav>
  </header>
  <main class="account-main">
    <h1 data-i18n="account">Account</h1>
    <p class="account-lede" data-i18n="acct_lede">Sign in for Ghal Bol. Full options — email, Google, Microsoft, GitHub, or phone.</p>
    <p class="account-status" id="auth-status" data-i18n="acct_continue_with">Continue with email, a provider, or phone.</p>
    <p class="auth-error" id="auth-error" hidden></p>

    <div id="auth-gate">
      <section class="auth-card" aria-labelledby="email-heading">
        <h2 id="email-heading" data-i18n="email">Email</h2>
        <form id="form-email">
          <label for="auth-display-name" data-i18n="acct_name_optional">Name (optional)</label>
          <input id="auth-display-name" name="name" type="text" autocomplete="name" />
          <label for="auth-email" data-i18n="email">Email</label>
          <input id="auth-email" name="email" type="email" autocomplete="email" required />
          <label for="auth-password" data-i18n="acct_password">Password</label>
          <input id="auth-password" name="password" type="password" autocomplete="current-password" required minlength="6" />
          <div class="auth-actions">
            <button type="submit" class="btn btn-primary" id="btn-continue" data-i18n="acct_continue">Continue</button>
          </div>
        </form>
      </section>

      <p class="auth-or" data-i18n="acct_or_continue">or continue with</p>
      <section class="auth-card auth-providers" aria-label="Federated sign-in" data-i18n-aria-label="acct_federated">
        <button type="button" class="btn btn-provider" id="btn-google">Google</button>
        <button type="button" class="btn btn-provider" id="btn-microsoft">Microsoft</button>
        <button type="button" class="btn btn-provider" id="btn-github">GitHub</button>
      </section>

      <section class="auth-card" aria-labelledby="phone-heading">
        <h2 id="phone-heading" data-i18n="acct_phone">Phone</h2>
        <div id="auth-phone-step">
          <form id="form-phone">
            <label for="auth-phone" data-i18n="acct_mobile">Mobile number</label>
            <input id="auth-phone" name="phone" type="tel" autocomplete="tel" placeholder="+91…" data-i18n-placeholder="acct_phone_placeholder" />
            <div class="auth-actions">
              <button type="submit" class="btn btn-primary" data-i18n="acct_send_sms">Send SMS code</button>
            </div>
          </form>
        </div>
        <div id="auth-sms-step" hidden>
          <form id="form-sms">
            <label for="auth-sms-code" data-i18n="acct_sms_code">SMS code</label>
            <input id="auth-sms-code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" />
            <div class="auth-actions">
              <button type="submit" class="btn btn-primary" data-i18n="acct_confirm_code">Confirm code</button>
            </div>
          </form>
        </div>
        <div id="recaptcha-container"></div>
      </section>
    </div>

    <div id="auth-session" hidden>
      <section class="auth-card">
        <h2 data-i18n="acct_signed_in">Signed in</h2>
        <div class="session-meta">
          <strong data-i18n="acct_signed_in_as">Signed in as</strong>
          <span id="session-email"></span>
          <strong data-i18n="acct_status_label">Status</strong>
          <span id="session-verified"></span>
        </div>
        <div class="auth-actions">
          <button type="button" class="btn btn-ghost" id="btn-resend-verify" data-i18n="acct_resend_verify">Resend verification email</button>
          <button type="button" class="btn btn-primary" id="btn-signout" data-i18n="acct_sign_out">Sign out</button>
        </div>
      </section>
    </div>
  </main>
</body>
</html>

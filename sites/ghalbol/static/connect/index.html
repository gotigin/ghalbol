        <svg viewBox="0 0 98 96" aria-hidden="true" focusable="false"><path fill="currentColor" fill-rule="evenodd" d="M48.854 0C21.839 0 0 22 0 49.217c0 21.756 13.993 40.172 33.405 46.69 2.427.49 3.316-1.059 3.316-2.362 0-1.141-.08-5.052-.08-9.127-13.59 2.934-16.42-5.867-16.42-5.867-2.184-5.704-5.42-7.17-5.42-7.17-4.448-3.015.324-3.015.324-3.015 4.934.326 7.523 5.052 7.523 5.052 4.367 7.496 11.404 5.378 14.235 4.074.404-3.178 1.699-5.378 3.074-6.6-10.839-1.141-22.243-5.378-22.243-24.283 0-5.378 1.94-9.778 5.014-13.2-.485-1.222-2.184-6.275.486-13.038 0 0 4.125-1.304 13.426 5.052a46.97 46.97 0 0 1 12.214-1.63c4.125 0 8.33.571 12.213 1.63 9.302-6.356 13.427-5.052 13.427-5.052 2.67 6.763.97 11.816.485 13.038 3.155 3.422 5.015 7.822 5.015 13.2 0 18.905-11.404 23.06-22.324 24.283 1.78 1.548 3.316 4.481 3.316 9.126 0 6.6-.08 11.897-.08 13.526 0 1.304.89 2.853 3.316 2.364 19.412-6.52 33.405-24.935 33.405-46.691C97.707 22 75.788 0 48.854 0z"/></svg>

  <main class="page-narrow" id="invite-root"></main>
  <script>
    const PLAY = "https://play.google.com/store/apps/details?id=com.ghalbol";

    function pathParts() {
      return location.pathname.split("/").filter(Boolean);
    }

    function aliasFromQuery() {
      const alias = new URLSearchParams(location.search).get("alias");
      return alias && alias.trim() ? alias.trim() : "";
    }

    function isHexKey(value) {
      return /^[0-9a-fA-F]{64,66}$/.test(value);
    }

    function embeddedBrowser() {
      const ua = navigator.userAgent || "";
      return /WhatsApp|Instagram|FBAN|FBAV|Line\/|Telegram/i.test(ua);
    }

    function t(key, english) {
      var fn = window.siteT;
      if (typeof fn === "function" && fn !== t) return fn(key, english);
      return english;
    }

    function fill(template, label) {
      return String(template).split("{label}").join(label);
    }

    async function copyText(text, labelKey, labelEn) {
      const label = t(labelKey, labelEn);
      try {
        await navigator.clipboard.writeText(text);
        alert(fill(t("copy_done", "{label} copied"), label));
      } catch (e) {
        prompt(fill(t("copy_prompt", "Copy this {label}"), label), text);
      }
    }

    function legalFoot() {
      return `
        <footer class="footer">
          <p><a href="/privacy" data-i18n="privacy">Privacy</a> · <a href="/terms" data-i18n="terms">Terms</a> · <a href="/support" data-i18n="support">Support</a> · <a href="/data-deletion" data-i18n="data_deletion">Data deletion</a> · <a href="/cancellation" data-i18n="cancellation">Cancellation</a> · <a href="/about" data-i18n="about">About</a></p>
          <p><a href="${PLAY}" data-i18n="play">Play</a> · <a href="/download/linux" data-i18n="nav_linux">Linux</a> · <a href="https://gotigin.com">gotigin.com</a></p>
          <p>Gotigin · GOTIGIN SOFTWARE &amp; HARDWARE PRIVATE LIMITED · Ghal Bol</p>
          <p>© 2026 GOTIGIN SOFTWARE &amp; HARDWARE PRIVATE LIMITED</p>
        </footer>`;
    }

    function badInvite() {
      return `
        <h1 data-i18n="invite_h1">Join on Ghal Bol</h1>
        <p data-i18n="invite_bad">Use a link like https://ghalbol.com/connect/&lt;public_key_hex&gt;</p>
        <a class="btn secondary block" href="/" data-i18n="back_home">Back to home</a>
        ${legalFoot()}
      `;
    }

    function invite(key) {
      const alias = aliasFromQuery();
      const app = "ghalbol://connect/" + key;
      const display = alias ? alias : key.slice(0, 8) + "…" + key.slice(-4);
      const embedded = embeddedBrowser();
      const warn = embedded
        ? `<div class="warn"><strong data-i18n="invite_embedded_title">Opened inside another app (e.g. WhatsApp)</strong><p data-i18n="invite_embedded_body">This built-in browser cannot open Ghal Bol. Tap the menu and open this page in Chrome, or copy the app link and paste it in Ghal Bol → Join.</p></div>`
        : `<p data-i18n="invite_hint">Tap Open in Ghal Bol below. If nothing happens, copy the app link and paste it inside Ghal Bol (Join).</p>`;
      const open = embedded ? "" : `<a class="btn primary block" href="${app}" data-i18n="invite_open">Open in Ghal Bol</a>`;
      return `
        <p class="eyebrow center" data-i18n="invite_kicker">Invitation</p>
        <h1 data-i18n="invite_h1">Join on Ghal Bol</h1>
        <p class="center"><strong>${display}</strong></p>
        ${warn}
        ${open}
        <button class="btn primary block" id="copy-web" type="button" data-i18n="copy_web">Copy web link</button>
        <button class="btn primary block" id="copy-app" type="button" data-i18n="copy_app">Copy app link</button>
        <h2 data-i18n="invite_install">Install the app</h2>
        <a class="btn primary block" href="${PLAY}" data-i18n="cta_google_play">Google Play</a>
        <a class="btn secondary block" href="/download/linux" data-i18n="cta_linux_dl">Linux download</a>
        <a class="btn secondary block" href="/" data-i18n="home">Home</a>
        ${legalFoot()}
      `;
    }

    function render() {
      const parts = pathParts();
      const root = document.getElementById("invite-root");
      const key = parts[0] === "connect" ? (parts[1] || "") : "";
      document.title = t("invite_h1", "Join on Ghal Bol");
      if (!isHexKey(key)) {
        root.innerHTML = badInvite();
        return;
      }
      const alias = aliasFromQuery();
      const https = location.origin + "/connect/" + key + (alias ? "?alias=" + encodeURIComponent(alias) : "");
      const app = "ghalbol://connect/" + key;
      root.innerHTML = invite(key);
      document.getElementById("copy-web").onclick = () => copyText(https, "label_web", "Web link");
      document.getElementById("copy-app").onclick = () => copyText(app, "label_app", "App link");
    }

    window.addEventListener("site:i18n", function () {
      document.title = t("invite_h1", "Join on Ghal Bol");
    });

    render();
  </script>
